name: Ubuntu Tailscale Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show Server Information
        shell: bash
        run: |

          echo ""
          echo "============================================================"
          echo "              UBUNTU SERVER INFORMATION"
          echo "============================================================"

          echo ""
          echo "OS:"
          . /etc/os-release
          echo "  $PRETTY_NAME"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

          echo ""
          echo "Public IPv4:"
          curl -4 -s https://api.ipify.org
          echo ""

          echo ""
          echo "CPU:"
          echo "  $(nproc) cores"

          echo ""
          echo "RAM:"
          free -h | awk '/Mem:/ {print "  " $2}'

          echo ""
          echo "Architecture:"
          echo "  $(uname -m)"

          echo ""
          echo "Kernel:"
          echo "  $(uname -r)"

          echo ""
          echo "Tailscale Status:"
          tailscale status

          echo ""
          echo "============================================================"
          echo "                    SERVER ONLINE"
          echo "============================================================"
          echo ""

      - name: Keep Server Online
        shell: bash
        run: |

          for i in $(seq 1 340); do
            echo "[$i/340] Server running..."
            sleep 60
          done
